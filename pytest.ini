[pytest]
testpaths = tests
addopts = --basetemp=tests/artifacts/pytest_tmp
markers =
    algorithm_interface: algorithm interface contract tests
    asyncio: coroutine tests run by tests/conftest.py
    category(name): test category metadata
    component: component contract tests
    condition: condition and environment contract tests
    dashboard: dashboard contract tests
    e2e: end-to-end contract tests
    heavy: long-running real-chain tests
    integration: integration contract tests
    layer(name): test layer metadata
    manual_network: tests that need manual network setup
    priority(level): release priority metadata
    requirement(text): requirement metadata
    requires_admin: tests that require administrator privileges
    resilience: resilience contract tests
    security: security contract tests
    slow: slow tests
    test_id(id): stable test identifier
    tested(file, function): implementation coverage metadata
    unit: unit tests
